name: Threat Stack
description: >-
  Threat Stack was a Boston-based cloud security company providing full-stack
  cloud security observability, intrusion detection, and compliance monitoring
  for infrastructure and applications across cloud-native workloads including
  virtual machines, containers, and Kubernetes. Its platform combined rules and
  supervised machine learning to detect threats, vulnerabilities, and attacks in
  real time. Threat Stack exposed a RESTful V2 API (HAWK/HMAC authenticated) and
  trigger-based webhook alerts, along with first-party SDKs, a Go CLI, and
  configuration-management modules (Chef, Ansible, Puppet, Terraform,
  CloudFormation, Helm). The company was acquired by F5 in 2021 and the product
  is now F5 Distributed Cloud App Infrastructure Protection (AIP); the original
  threatstack.com and api.threatstack.com domains have been decommissioned.
